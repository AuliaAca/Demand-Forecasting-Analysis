[project]
name = "demandflow"
version = "0.1.0"
description = "DemandFlow — Retail Demand Forecasting & Planning Intelligence Platform (portfolio project)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "kaggle>=1.6",
    "py7zr>=0.21",
    "matplotlib>=3.8",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "sqlglot>=25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
