# Phase 15 (Testing & Reliability). Runs lint and the full test suite on
# every push/PR, entirely against tests/fixtures/favorita_sample/ -- no
# Kaggle, GCP/BigQuery, or Looker Studio credentials are needed or used
# (see docs/phase_reports/phase15.md for the real-data-access gap this
# project has worked under since Phase 01). This is the project's only
# automated, repo-hosted proof that the suite (326 tests as of Phase 15)
# and its "rebuild, don't trust a stale file" pipelines actually run clean
# on a fresh checkout, not just in this development sandbox.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -q
